name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege by default; only the publish job widens this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint (Spotless check)
        run: ./mvnw -B spotless:check

      - name: Build + unit + integration tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  image-scan:
    name: Build image & Trivy scan
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          push: false
          tags: apex-operations-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install a pinned Trivy binary directly. The trivy-action's bundled installer
      # (setup-trivy) is flaky on hosted runners; a direct download is deterministic.
      - name: Install Trivy (pinned)
        run: |
          TRIVY_VERSION=0.76.1
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # Cache the vulnerability DB so repeat runs don't re-download it. Trivy's default
      # sources (mirror.gcr.io first, then ghcr.io) avoid the single-mirror anonymous-pull
      # rate limits we hit when forcing a specific mirror.
      - name: Cache Trivy DB
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Trivy image scan (fails build on fixable CRITICAL)
        run: |
          trivy image --scanners vuln \
            --severity CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 1 \
            apex-operations-api:ci-${{ github.sha }}

      - name: Trivy filesystem scan (dependencies, report-only)
        run: |
          # --offline-scan: don't resolve the dependency tree via Maven Central (avoids 429
          # rate limits on the runner). The image scan above already covers the bundled jars.
          trivy fs --scanners vuln --offline-scan \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore --exit-code 0 .

  publish:
    name: Publish image to GHCR
    needs: [build-test, image-scan]
    # Only publish on pushes to main or version tags — never on pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/apex-operations-api
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
